<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fontconfig scoped for CloakBrowser (clk).
  Does NOT include /etc/fonts/fonts.conf so user fonts
  (~/.local/share/fonts) are not leaked into the profile.
  Brave/Chrome keep using the system config.

  Copy to ~/.cloak/fonts.conf and put Windows fonts in ~/.cloak/winfonts.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <!-- relative to this file (put it at ~/.cloak/fonts.conf) -->
  <dir>winfonts</dir>
  <cachedir>fontcache</cachedir>
</fontconfig>
